[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlean-cli"
version = "1.0.0"
authors = [
    { name = "chineduemma007", email = "chineduemma007@users.noreply.github.com" }
]
description = "Token-Efficient Git Pull Explainer & Reviewer Proxy using Paritok"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0"
]

[project.urls]
"Homepage" = "https://github.com/chineduemma007/gitlean"
"Bug Tracker" = "https://github.com/chineduemma007/gitlean/issues"

[project.scripts]
gitlean = "run_backend:main"

[tool.setuptools]
packages = ["backend"]
py-modules = ["run_backend"]
